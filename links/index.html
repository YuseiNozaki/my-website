<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>関連リンク | 野﨑 優晴</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .page-hero {
      padding: 72px 22px 48px;
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .page-hero-en {
      font-family: var(--ff-en);
      font-weight: 300;
      font-style: italic;
      font-size: 2.8rem;
      color: var(--green-lt);
      letter-spacing: 0.04em;
      line-height: 1;
      display: block;
    }
    .page-hero-jp {
      font-family: var(--ff-jp);
      font-weight: 300;
      font-size: 1.3rem;
      letter-spacing: 0.14em;
      color: var(--ink);
      display: block;
      margin-top: 10px;
    }

    .links-section {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 22px 80px;
    }
    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      cursor: pointer;
    }
    .link-card:hover {
      border-color: var(--green-mid);
      box-shadow: 0 4px 20px oklch(0.44 0.12 148 / 0.1);
      transform: translateY(-2px);
    }
    .link-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: var(--bg-deep);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .link-icon svg { width: 20px; height: 20px; }
    .link-info { flex: 1; min-width: 0; }
    .link-name {
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.03em;
      margin-bottom: 3px;
    }
    .link-url {
      font-size: 0.72rem;
      color: var(--ink-lt);
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link-arrow {
      color: var(--green-mid);
      font-size: 1rem;
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.2s;
    }
    .link-card:hover .link-arrow {
      opacity: 1;
      transform: translateX(3px);
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <a href="../index.html" class="nav-logo">Y. Nozaki</a>
  <ul class="nav-links">
    <li><a href="../index.html">トップ</a></li>
    <li><a href="../career/index.html">経歴</a></li>
    <li><a href="../research/index.html">研究</a></li>
    <li><a href="../links/index.html" class="active">リンク</a></li>
  </ul>
  <button class="nav-hamburger" id="nav-hamburger" aria-label="メニュー">
    <span></span><span></span><span></span>
  </button>
</nav>

<main class="page">

  <div class="page-hero reveal">
    <span class="page-hero-en">Links</span>
    <span class="page-hero-jp">関連リンク</span>
  </div>

  <section class="links-section reveal">

    <a class="link-card" href="https://researchmap.jp/yusei_nozaki" target="_blank" rel="noopener">
      <div class="link-icon">
        <!-- Research icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
          <path d="M8 11h6M11 8v6"/>
        </svg>
      </div>
      <div class="link-info">
        <div class="link-name">researchmap</div>
        <div class="link-url">researchmap.jp/yusei_nozaki</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a class="link-card" href="https://roots-official.jp" target="_blank" rel="noopener">
      <div class="link-icon">
        <!-- Building icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="14" rx="1"/>
          <path d="M8 21V11h8v10"/>
          <path d="M3 7l9-4 9 4"/>
        </svg>
      </div>
      <div class="link-info">
        <div class="link-name">株式会社ルーツ</div>
        <div class="link-url">roots-official.jp</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a class="link-card" href="https://yokohama-study.com" target="_blank" rel="noopener">
      <div class="link-icon">
        <!-- Book icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
      </div>
      <div class="link-info">
        <div class="link-name">家庭教師のネクスタ</div>
        <div class="link-url">yokohama-study.com</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a class="link-card" href="https://yokohama-softtennis.com" target="_blank" rel="noopener">
      <div class="link-icon">
        <!-- Tennis / circle icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3.6 9a9 9 0 0116.8 0"/>
          <path d="M3.6 15a9 9 0 0016.8 0"/>
        </svg>
      </div>
      <div class="link-info">
        <div class="link-name">ソフトテニススクール Nexus</div>
        <div class="link-url">yokohama-softtennis.com</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

  </section>

</main>

<footer class="site-footer">
  © 2026 Yusei Nozaki. All rights reserved.
</footer>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
    });
  }, { threshold: 0.08 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // Hamburger menu
  const hamburger = document.getElementById('nav-hamburger');
  const navLinks = document.querySelector('.nav-links');
  if (hamburger) {
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      navLinks.classList.toggle('open');
    });
    navLinks.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        hamburger.classList.remove('open');
        navLinks.classList.remove('open');
      });
    });
  }
</script>

</body>
</html>
